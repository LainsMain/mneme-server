name: Release server

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - name: Resolve semantic version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: lainsmain
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            lainsmain/mneme-server:${{ steps.version.outputs.value }}
            lainsmain/mneme-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/LainsMain/mneme-server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - name: Publish release notes and deployment files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" compose.yaml stack.env.example LICENSE --verify-tag --generate-notes
